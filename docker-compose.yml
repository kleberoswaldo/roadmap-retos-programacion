version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: miduvi-postgres
    environment:
      POSTGRES_DB: miduvi
      POSTGRES_USER: miduvi
      POSTGRES_PASSWORD: miduvi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miduvi -d miduvi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: